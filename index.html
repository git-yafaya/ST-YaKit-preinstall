<!doctype html>
<html lang="zh-CN" class="yakit-workbench" data-theme="st">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>预设工作台</title>
  <link rel="icon" href="ui/workbench.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="core/state.js"></script>
  <script defer src="core/prompts.js"></script>
  <script defer src="core/settings.js"></script>
  <script defer src="core/presets.js"></script>
  <script defer src="core/workbench.js"></script>
  <script defer src="host/api.js"></script>
  <script defer src="host/api-profiles.js"></script>
  <script defer src="host/presets.js"></script>
  <script defer src="host/st-host.js"></script>
  <script defer src="ui/settings-template.js"></script>
  <script defer src="ui/theme-view.js"></script>
  <script defer src="ui/settings-api-view.js"></script>
  <script defer src="ui/settings-prompt-view.js"></script>
  <script defer src="ui/settings-view.js"></script>
  <script defer src="ui/trial-template.js"></script>
  <script defer src="ui/versions-template.js"></script>
  <script defer src="ui/preset-template.js"></script>
  <script defer src="ui/workbench-template.js"></script>
  <script defer src="ui/navigation-view.js"></script>
  <script defer src="ui/preset-entries-view.js"></script>
  <script defer src="ui/preset-view.js"></script>
  <script defer src="ui/toast.js"></script>
  <script defer src="ui/select-view.js"></script>
  <script defer src="ui/workbench-view.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="app-toolbar" aria-label="工作台控制">
    <h1 class="app-brand"><span class="app-brand-icon" aria-hidden="true"></span>预设工作台</h1>
    <span id="page-title" class="sr-only">工作台</span>
    <div id="settings-actions" class="settings-header-actions" hidden>
      <button id="settings-back" class="button button-secondary" type="button">返回</button>
      <button id="settings-reset" class="button button-secondary" type="button" hidden>重置</button>
      <button id="settings-delete" class="button button-secondary" type="button" hidden>删除</button>
      <button id="settings-save" class="button button-primary" type="button">保存</button>
    </div>
    <button id="workbench-close" class="button button-quiet" type="button" aria-label="关闭工作台" title="关闭工作台"><span aria-hidden="true">×</span></button>
  </header>
  <div id="app"></div>
  <noscript>请启用 JavaScript，使用提示词工作台。</noscript>
</body>
</html>
